[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoforge-ai"
version = "0.1.0"
description = "Autonomous, self-healing, and verifiable software engineering platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "structlog>=24.4,<30.0",
    "tenacity>=9.0,<10.0",
    "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "engine*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "data",
    "artifacts",
    "sandbox",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
    "^data/",
    "^artifacts/",
    "^sandbox/",
]

[tool.coverage.run]
branch = true
source = ["backend", "engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80