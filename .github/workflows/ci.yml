name: EvoForge AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality, Tests and Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check backend tests

      - name: Run MyPy
        run: python -m mypy backend tests

      - name: Run tests with coverage
        run: python -m pytest --cov=backend --cov-report=term-missing

      - name: Run source security scan
        run: python -m bandit -r backend

      - name: Audit dependencies
        run: python -m pip_audit