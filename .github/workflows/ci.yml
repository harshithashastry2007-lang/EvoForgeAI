name: EvoForge AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality, Tests and Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check backend tests

      - name: Run MyPy
        run: python -m mypy backend tests

      - name: Run tests with coverage
        run: python -m pytest --cov=backend --cov-report=term-missing

      - name: Run source security scan
        run: python -m bandit -r backend

      - name: Audit dependencies
        run: python -m pip_audit

  container-validation:
    name: Build and Validate Container
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build \
            --file infra/docker/backend.Dockerfile \
            --tag evoforge-ai:test \
            .

      - name: Verify non-root image user
        run: |
          test "$(docker inspect --format='{{.Config.User}}' evoforge-ai:test)" = "evoforge"

      - name: Run restricted backend container
        run: |
          docker run --detach \
            --name evoforge-ai-test \
            --publish 8000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            evoforge-ai:test

      - name: Verify container health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs evoforge-ai-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs evoforge-ai-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force evoforge-ai-test || true